<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Buildocrat Value Lens (US)</title>
<style>
:root{--bg:#FFFFFF;--ink:#22275A;--muted:#5E638E;--line:#D3D6EA;--accent:#1D2675}
@media (prefers-color-scheme:dark){:root{--bg:#171B47;--ink:#E7E9FA;--muted:#A3A8D6;--line:#2C3270;--accent:#C9CEFF}}
body{margin:0;width:320px;background:var(--bg);color:var(--ink);font:13px/1.45 "Poppins","Segoe UI",Roboto,Arial,sans-serif}
.w{padding:14px}h1{font:700 16px Arial,sans-serif;margin:0}h1 span{color:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.seg{display:flex;gap:4px;margin-top:8px}.seg button{flex:1;font:600 12px Arial;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:5px 0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
input[type=text]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:6px}
.btn{font:600 12px Arial;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;margin-top:6px}
.res{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.res b{font-family:ui-monospace,Menlo,Consolas,monospace}
.m{color:var(--muted);font-size:12px}a{color:var(--accent);font-weight:600}
label.sw{display:flex;gap:8px;align-items:center;font-weight:600}
</style></head><body><div class="w">
<h1>Buildocrat <span>Value Lens</span> US</h1>
<p class="m">Hover over Google Maps or OpenStreetMap anywhere in the US. Hold Shift to pin the card. Alt+Shift+V turns it on or off.</p>
<div class="row"><label class="sw"><input type="checkbox" id="on"> Show values on maps</label></div>
<div class="seg" id="tabs"><button data-t="land">Land</button><button data-t="bld">Home</button><button data-t="rent">Rent</button></div>
<div class="res"><label for="q" class="m">Value a pin: coordinates or a map link</label>
<input type="text" id="q" placeholder="33.7490, -84.3880"><button class="btn" id="go">Value it</button>
<div id="out" class="m" aria-live="polite"></div></div>
<p class="m" id="meta"></p>
</div><script src="popup.js"></script></body></html>
