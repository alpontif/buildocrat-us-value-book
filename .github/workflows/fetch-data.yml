name: Fetch source data
# Downloads the public source files (Census, FHFA, HUD, USDA, OpenStreetMap) into pipeline/raw/ and commits them.
# Runs when pipeline/fetch-request.txt changes (it lists the sources to fetch), by hand, and on the 3rd of each month.
on:
  push:
    branches: [main]
    paths: ["pipeline/fetch-request.txt"]
  schedule:
    - cron: "41 3 3 * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to fetch (blank = all): gazetteer boundaries acs fhfa_land hpi fmr cbsa nass osm"
        default: ""
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SRC="${{ inputs.sources }}";
          elif [ "${{ github.event_name }}" = "push" ]; then SRC="$(grep -v '^#' pipeline/fetch-request.txt | tr '\n' ' ')";
          else SRC=""; fi
          echo "Fetching: ${SRC:-everything}"
          set -o pipefail
          python pipeline/fetch.py $SRC 2>&1 | tee pipeline/raw/fetch-log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "buildocrat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A pipeline/raw
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Source data $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done; exit 1
