name: Weekly refresh
# Every Monday 11:13 UTC (07:13 US Eastern, 12:13 in Nigeria): pick up new FHFA, HUD, USDA and Census releases, rebuild, check, publish.
on:
  schedule:
    - cron: "13 11 * * 1"
  workflow_dispatch:
    inputs:
      fetch:
        description: "Download new source releases first (untick to rebuild from the files already in the repo)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, model, check, build pages
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.fetch }}" = "false" ]; then
            python pipeline/refresh.py 2>&1 | tee pipeline/raw/refresh-log.txt
          else
            python pipeline/refresh.py --fetch 2>&1 | tee pipeline/raw/refresh-log.txt
          fi
      - name: Commit and push (GitHub Pages republishes automatically)
        if: always()
        run: |
          git config user.name "buildocrat-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ job.status }}" != "success" ]; then
            echo "Refresh failed: keeping last week's site, saving only the log and source files."
            git checkout -- docs && git clean -fdq docs
          fi
          git add -A docs pipeline/raw
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X ours && git push && exit 0; sleep 10; done; exit 1
      - name: Tell search engines (IndexNow)
        if: success()
        run: |
          sleep 150
          python indexnow.py
